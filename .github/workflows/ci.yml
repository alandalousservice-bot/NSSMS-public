name: validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nssms
          POSTGRES_PASSWORD: nssms
          POSTGRES_DB: nssms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nssms -d nssms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nssms:nssms@localhost:5432/nssms
      AUTH_SECRET: ci-only-not-a-production-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run migrate
        working-directory: backend
      - run: git clone https://github.com/thehocinesaad/laravel-algereography.git .ci-geography && git -C .ci-geography checkout 3002ce47fccf9a108604c914af346bb441a2f8f7
      - run: npm run import:geography
        working-directory: backend
        env:
          GEOGRAPHY_SOURCE_DIR: ../.ci-geography/database/seeders
      - run: npm run seed:data
        working-directory: backend
      - run: npm run seed:demo
        working-directory: backend
        env:
          DEMO_ADMIN_PASSWORD: NssmsDemoAdmin-2026!
          DEMO_NATIONAL_PASSWORD: NssmsDemoNational-2026!
      - run: npm run seed:national-accounts
        working-directory: backend
        env:
          DEMO_ADMIN_PASSWORD: ci-demo-admin-password
          DEMO_NATIONAL_PASSWORD: ci-demo-national-password
      - run: npm run seed:scoped-accounts
        working-directory: backend
        env:
          ASSOCIATION_ADMIN_PASSWORD: ci-association-admin-password
          ASSOCIATION_REP_PASSWORD: ci-association-representative-password
          INSTITUTION_USER_PASSWORD: ci-institution-user-password
          DAIRA_OFFICER_PASSWORD: ci-daira-officer-password
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  pilot-startup-no-seed:
    # Proves the pilot deployment contract from
    # docs/000_Project/014_Pilot_Security_Hardening.md section 8: the API boots
    # against a freshly migrated database with production configuration and
    # zero demo seeding.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nssms
          POSTGRES_PASSWORD: nssms
          POSTGRES_DB: nssms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nssms -d nssms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nssms:nssms@localhost:5432/nssms
      NODE_ENV: production
      AUTH_SECRET: pilot-startup-ci-secret-0123456789abcdef
      CORS_ALLOWED_ORIGINS: https://pilot.example.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run migrate
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Boot the API unseeded and verify readiness and demo isolation
        working-directory: backend
        run: |
          node dist/server.js &
          server_pid=$!
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ready 2>/dev/null | grep -q '"database":"ok"'; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::API did not become ready on a fresh migrated database"
            kill $server_pid 2>/dev/null || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/health
          echo
          users=$(psql "$DATABASE_URL" -tAc 'select count(*) from users')
          echo "users after unseeded startup: $users"
          if [ "$users" != "0" ]; then
            echo "::error::startup must not seed any accounts on a pilot database"
            kill $server_pid 2>/dev/null || true
            exit 1
          fi
          kill $server_pid 2>/dev/null || true
